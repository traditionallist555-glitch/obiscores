<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBi'SCORES - Live Football Updates</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }
    header {
      background-color: #020617;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .ad-slot {
      background-color: #1e293b;
      border: 1px dashed #475569;
      min-height: 90px;
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .teams { font-weight: 600; font-size: 0.95rem; }
    .status { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 4px;
      min-width: 50px;
      text-align: center;
    }

    .sticky-bottom-ad {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #020617;
      border-top: 1px solid #334155;
      text-align: center;
      z-index: 9999;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>OBi'SCORES</h1>
    <div class="subtitle">● Live Football Updates</div>
  </header>

  <div class="container">
    
    <!-- TOP ADSTERRA AD SLOT -->
    <div class="ad-slot" id="top-ad-container">
      <script>
        atOptions = {
          'key' : '3c42401d24526066c62f017385299762',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script src="https://www.highrevenueformat.com/3c42401d24526066c62f017385299762/invoke.js"></script>
    </div>

    <!-- LIVE MATCHES CONTAINER -->
    <div id="matches-list">
      <div style="text-align: center; padding: 20px; color: var(--muted);">Loading live matches...</div>
    </div>

  </div>

  <!-- STICKY BOTTOM ADSTERRA AD SLOT -->
  <div class="sticky-bottom-ad" id="bottom-ad-container">
    <span style="color: #64748b; font-size: 0.75rem;">Ad Space</span>
  </div>

  <script>
    async function fetchScores() {
      const container = document.getElementById('matches-list');
      try {
        const res = await fetch('/api/scores');
        const data = await res.json();

        // Extract matches array from various possible wrapper keys
        let matches = [];
        if (Array.isArray(data)) {
          matches = data;
        } else if (data?.response?.matches) {
          matches = data.response.matches;
        } else if (data?.response && Array.isArray(data.response)) {
          matches = data.response;
        } else if (data?.data && Array.isArray(data.data)) {
          matches = data.data;
        }

        if (!matches || matches.length === 0) {
          container.innerHTML = `
            <div style="text-align: center; padding: 20px; color: var(--muted);">
              No active live matches right now. Check back shortly for upcoming fixtures!
            </div>
          `;
          return;
        }

        let html = '';
        matches.slice(0, 20).forEach(m => {
          const home = m.home?.name || m.homeTeam || m.team_home || 'Home';
          const away = m.away?.name || m.awayTeam || m.team_away || 'Away';
          const homeScore = m.home?.score ?? m.homeScore ?? m.score_home ?? 0;
          const awayScore = m.away?.score ?? m.awayScore ?? m.score_away ?? 0;
          const status = m.status?.reason?.short || m.status || 'Live';

          html += `
            <div class="match-card">
              <div>
                <div class="teams">${home} vs ${away}</div>
                <div class="status">${status}</div>
              </div>
              <div class="score">${homeScore} - ${awayScore}</div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error('Render error:', err);
        container.innerHTML = `
          <div style="text-align: center; padding: 20px; color: var(--muted);">
            Connecting to live score feed...
          </div>
        `;
      }
    }

    fetchScores();

    // Auto Refresh every 60 seconds (CDN Cached to protect API rate limits)
    setInterval(fetchScores, 60000);
  </script>
</body>
</html>
