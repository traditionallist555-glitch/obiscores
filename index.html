<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBi'SCORES - Clean & Fast Live Scores</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
      padding-bottom: 90px;
    }
    header {
      background-color: #020617;
      padding: 15px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; color: var(--accent); }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .ad-slot {
      background-color: #1e293b;
      border: 1px dashed #475569;
      min-height: 90px;
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .sticky-bottom-ad {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #020617;
      border-top: 1px solid #334155;
      text-align: center;
      z-index: 9999;
      min-height: 50px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid var(--accent);
    }
    .teams { font-weight: 600; font-size: 0.95rem; }
    .status { font-size: 0.75rem; color: var(--muted); }
    .score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      background: #0f172a;
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <h1>OBi'SCORES</h1>
    <div class="subtitle">● Live Football Updates</div>
  </header>

  <div class="container">
    
    <!-- TOP ADSTERRA AD SLOT -->
    <div class="ad-slot" id="top-ad-container">
      <span style="color: #64748b; font-size: 0.8rem;">Ad Space</span>
    </div>

    <!-- LIVE MATCHES CONTAINER -->
    <div id="matches-list">
      <div style="text-align: center; padding: 20px; color: var(--muted);">Loading live matches...</div>
    </div>

  </div>

  <!-- STICKY BOTTOM ADSTERRA AD SLOT -->
  <div class="sticky-bottom-ad" id="bottom-ad-container">
    <span style="color: #64748b; font-size: 0.75rem;">Ad Space</span>
  </div>

  <script>
    async function fetchScores() {
      try {
        const matches = [
          { home: "Arsenal", away: "Chelsea", score: "2 - 1", time: "76'" },
          { home: "Real Madrid", away: "Barcelona", score: "1 - 0", time: "52'" },
          { home: "Bayern Munich", away: "Dortmund", score: "0 - 0", time: "18'" }
        ];

        let html = '';
        matches.forEach(m => {
          html += `
            <div class="match-card">
              <div>
                <div class="teams">${m.home} vs ${m.away}</div>
                <div class="status">Live • ${m.time}</div>
              </div>
              <div class="score">${m.score}</div>
            </div>
          `;
        });
        document.getElementById('matches-list').innerHTML = html;
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }

    fetchScores();

    const REFRESH_INTERVAL = 45000;
    let adRefreshTimer = null;

    function refreshAds() {
      const topAd = document.getElementById('top-ad-container');
      const bottomAd = document.getElementById('bottom-ad-container');
      
      [topAd, bottomAd].forEach(container => {
        const iframes = container.getElementsByTagName('iframe');
        for (let i = 0; i < iframes.length; i++) {
          iframes[i].src = iframes[i].src;
        }
      });
      
      fetchScores();
    }

    function startAdTimer() {
      if (!adRefreshTimer) {
        adRefreshTimer = setInterval(refreshAds, REFRESH_INTERVAL);
      }
    }

    function stopAdTimer() {
      clearInterval(adRefreshTimer);
      adRefreshTimer = null;
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        stopAdTimer();
      } else {
        startAdTimer();
      }
    });

    startAdTimer();
  </script>
</body>
  </html>
