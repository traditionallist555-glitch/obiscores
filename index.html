<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBi'SCORES - Live Football & Streams</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0e14; color: #e2e8f0; font-size: 13px; padding-bottom: 70px; }
    
    header { background: #111827; padding: 12px 16px; border-bottom: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
    .brand-title { color: #22c55e; font-size: 18px; font-weight: bold; }
    .sub-brand { color: #9ca3af; font-size: 11px; }

    .ad-slot { margin: 10px auto; text-align: center; min-height: 90px; }
    .ad-label { font-size: 10px; color: #6b7280; margin-bottom: 4px; }

    .league-header {
      background: #1e293b;
      color: #f8fafc;
      font-weight: bold;
      font-size: 12px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid #22c55e;
      margin-top: 8px;
    }
    .flag-icon { width: 18px; height: 13px; object-fit: cover; border-radius: 2px; }

    .match-row {
      display: flex;
      padding: 8px 12px;
      border-bottom: 1px solid #1f2937;
      align-items: center;
      background: #0b0e14;
    }
    .match-time { width: 50px; color: #9ca3af; font-size: 11px; }
    .match-time.live { color: #ef4444; font-weight: bold; }
    .match-teams { flex: 1; color: #f3f4f6; font-size: 13px; }
    .match-score {
      font-weight: bold;
      color: #22c55e;
      background: #111827;
      padding: 3px 8px;
      border-radius: 4px;
      min-width: 45px;
      text-align: center;
    }

    .stream-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      margin-bottom: 15px;
    }
    iframe { width: 100%; height: 100%; border: none; }

    .sticky-bottom-ad {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #111827; border-top: 1px solid #1f2937;
      text-align: center; z-index: 9999; min-height: 50px;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="brand-title">OBi'SCORES</div>
      <div class="sub-brand">Live Coverage & Streams</div>
    </div>
  </header>

  <!-- TOP ADSTERRA BANNER SLOT -->
  <div class="ad-slot">
    <div class="ad-label">Advertisement</div>
    <script>
      atOptions = {
        'key' : '3c42401d24526066c62f017385299762',
        'format' : 'iframe',
        'height' : 90,
        'width' : 728,
        'params' : {}
      };
    </script>
    <script src="https://www.highrevenueformat.com/3c42401d24526066c62f017385299762/invoke.js"></script>
  </div>

  <div id="matches-container">
    <div style="padding: 20px; text-align: center; color: #9ca3af;">Loading live feed...</div>
  </div>

  <div class="sticky-bottom-ad">
    <span style="color: #6b7280; font-size: 11px;">Ad Space</span>
  </div>

  <script>
    let isoMap = {};

    async function initFlags() {
      try {
        const res = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2');
        const countries = await res.json();
        countries.forEach(c => {
          if (c.name?.common && c.cca2) isoMap[c.name.common.toLowerCase()] = c.cca2.toLowerCase();
        });
        isoMap['england'] = 'gb-eng';
        isoMap['wales'] = 'gb-wls';
        isoMap['scotland'] = 'gb-sct';
      } catch (e) {}
    }

    function getFlag(title, countryCode) {
      if (countryCode && countryCode.length === 2) return `https://flagcdn.com/24x18/${countryCode.toLowerCase()}.png`;
      if (!title) return 'https://flagcdn.com/24x18/un.png';
      const clean = title.toLowerCase();
      for (const [name, code] of Object.entries(isoMap)) {
        if (clean.includes(name)) return `https://flagcdn.com/24x18/${code}.png`;
      }
      return 'https://flagcdn.com/24x18/un.png';
    }

    function renderTwitchStream() {
      return `
        <div class="league-header">
          <img src="https://flagcdn.com/24x18/un.png" class="flag-icon" alt="flag">
          <span>LIVE BROADCAST: EA Sports FC / Football Stream</span>
        </div>
        <div class="stream-container">
          <iframe 
            src="https://player.twitch.tv/?channel=easportsfc&parent=obiscores.vercel.app&autoplay=true&muted=true" 
            allowfullscreen>
          </iframe>
        </div>
      `;
    }

    async function loadScores() {
      const container = document.getElementById('matches-container');
      try {
        const res = await fetch('/api/scores');
        const rawData = await res.json();

        let list = [];
        if (Array.isArray(rawData)) list = rawData;
        else if (rawData?.response) {
          if (Array.isArray(rawData.response)) list = rawData.response;
          else if (typeof rawData.response === 'object') {
            Object.values(rawData.response).forEach(val => {
              if (Array.isArray(val)) list.push(...val);
            });
          }
        }

        // If the API failed, hit limits, or returned zero matches, load the Twitch Live Broadcast stream instead!
        if (rawData.useTwitchFallback || list.length === 0) {
          container.innerHTML = renderTwitchStream() + `<div style="padding: 15px; text-align: center; color: #9ca3af;">Live Scores updating shortly...</div>`;
          return;
        }

        const groups = {};
        list.forEach(m => {
          const leagueName = m.league?.name || m.tournament?.name || m.country || "FOOTBALL FIXTURES";
          const cc = m.league?.countryCode || m.countryCode || "";
          if (!groups[leagueName]) groups[leagueName] = { matches: [], cc };
          groups[leagueName].matches.push(m);
        });

        let html = renderTwitchStream(); // Displays Twitch player at top for live match streams
        for (const [title, group] of Object.entries(groups)) {
          const flagUrl = getFlag(title, group.cc);
          html += `
            <div class="league-header">
              <img src="${flagUrl}" class="flag-icon" alt="flag" onerror="this.src='https://flagcdn.com/24x18/un.png'">
              <span>${title}</span>
            </div>
          `;

          group.matches.forEach(m => {
            const home = m.home?.name || m.homeTeam?.name || 'Home';
            const away = m.away?.name || m.awayTeam?.name || 'Away';
            const homeScore = m.home?.score ?? m.scores?.home ?? '-';
            const awayScore = m.away?.score ?? m.scores?.away ?? '-';
            const status = m.status?.reason?.short || m.status || 'FT';
            const isLive = status.includes("'") || status === 'LIVE';

            html += `
              <div class="match-row">
                <div class="match-time ${isLive ? 'live' : ''}">${status}</div>
                <div class="match-teams">${home} vs ${away}</div>
                <div class="match-score ${isLive ? 'live' : ''}">${homeScore} - ${awayScore}</div>
              </div>
            `;
          });
        }

        container.innerHTML = html;
      } catch (err) {
        container.innerHTML = renderTwitchStream();
      }
    }

    initFlags().then(() => {
      loadScores();
      setInterval(loadScores, 60000);
    });
  </script>
</body>
</html>
