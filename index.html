<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ObiScores - Live Football Scores</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #2ea043;
      --muted: #8b949e;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      color: var(--white);
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    main {
      flex: 1;
      max-width: 600px;
      width: 100%;
      margin: 20px auto;
      padding: 0 15px;
    }

    .matches-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .match-card:hover {
      border-color: var(--muted);
    }

    .teams {
      font-weight: 600;
      color: var(--white);
      font-size: 1rem;
      margin-bottom: 4px;
    }

    .status {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 500;
      text-transform: uppercase;
    }

    .score {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(46, 160, 67, 0.1);
      padding: 6px 12px;
      border-radius: 6px;
      min-width: 65px;
      text-align: center;
    }

    .loading, .error-msg, .no-matches {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 15px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>ObiScores</h1>
    <p>Live Football Updates & Fixtures</p>
  </header>

  <main>
    <div id="matches-list" class="matches-container">
      <div class="loading">Loading live match data...</div>
    </div>
  </main>

  <footer>
    &copy; ObiScores &bull; Cached Edge Server Powered
  </footer>

  <script>
    async function fetchScores() {
      const container = document.getElementById('matches-list');
      try {
        const res = await fetch('/api/scores');
        
        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const result = await res.json();

        // Safe extraction for various RapidAPI football data structures
        const matches = result?.response?.matches || result?.response || result?.matches || [];

        if (!Array.isArray(matches) || matches.length === 0) {
          container.innerHTML = `<div class="no-matches">No live matches right now. Check back shortly!</div>`;
          return;
        }

        let html = '';
        matches.slice(0, 20).forEach(m => {
          const homeName = m.home?.name || m.homeTeam?.name || m.teams?.home?.name || 'Home';
          const awayName = m.away?.name || m.awayTeam?.name || m.teams?.away?.name || 'Away';
          const homeScore = m.home?.score ?? m.scores?.home ?? m.goals?.home ?? 0;
          const awayScore = m.away?.score ?? m.scores?.away ?? m.goals?.away ?? 0;
          const status = m.status?.reason?.short || m.status?.type || m.status?.short || 'Live';

          html += `
            <div class="match-card">
              <div>
                <div class="teams">${homeName} vs ${awayName}</div>
                <div class="status">${status}</div>
              </div>
              <div class="score">${homeScore} - ${awayScore}</div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error('Fetch error:', err);
        container.innerHTML = `<div class="error-msg">Unable to load live scores right now. Retrying shortly...</div>`;
      }
    }

    // Initial Fetch
    fetchScores();

    // Auto Refresh every 60 seconds (Backend caching handles quota safety)
    setInterval(fetchScores, 60000);
  </script>

</body>
</html>
