<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBi'SCORES - Live Football Scores</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #2ea043;
      --muted: #8b949e;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      text-align: center;
    }

    header h1 {
      color: var(--accent);
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    main {
      flex: 1;
      max-width: 650px;
      width: 100%;
      margin: 0 auto;
      padding: 15px;
    }

    .ad-container {
      background-color: var(--card-bg);
      border: 1px dashed var(--border);
      min-height: 90px;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 8px;
    }

    .matches-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .match-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .teams {
      font-weight: 600;
      color: var(--white);
      font-size: 0.95rem;
      margin-bottom: 3px;
    }

    .status {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 500;
    }

    .score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(46, 160, 67, 0.12);
      padding: 5px 10px;
      border-radius: 6px;
      min-width: 60px;
      text-align: center;
    }

    .loading, .error-msg, .no-matches {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .sticky-bottom-ad {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #020617;
      border-top: 1px solid var(--border);
      text-align: center;
      z-index: 9999;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>OBi'SCORES</h1>
    <p>● Live Football Updates</p>
  </header>

  <main>
    <!-- TOP ADSTERRA AD SLOT -->
    <div class="ad-container" id="top-ad-container">
      <script>
        atOptions = {
          'key' : '3c42401d24526066c62f017385299762',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script src="https://www.highrevenueformat.com/3c42401d24526066c62f017385299762/invoke.js"></script>
    </div>

    <!-- LIVE MATCHES CONTAINER -->
    <div id="matches-list" class="matches-container">
      <div class="loading">Fetching live fixtures...</div>
    </div>
  </main>

  <!-- STICKY BOTTOM AD SLOT -->
  <div class="sticky-bottom-ad" id="bottom-ad-container">
    <span style="color: #64748b; font-size: 0.75rem;">Ad Space</span>
  </div>

  <script>
    async function fetchScores() {
      const container = document.getElementById('matches-list');
      try {
        const res = await fetch('/api/scores');
        
        if (!res.ok) {
          throw new Error(`HTTP Error: ${res.status}`);
        }

        const result = await res.json();
        const matches = result?.response?.matches || result?.response || result?.matches || [];

        if (!Array.isArray(matches) || matches.length === 0) {
          container.innerHTML = `<div class="no-matches">No live matches right now. Check back shortly!</div>`;
          return;
        }

        let html = '';
        matches.slice(0, 20).forEach(m => {
          const homeName = m.home?.name || m.homeTeam?.name || m.teams?.home?.name || 'Home';
          const awayName = m.away?.name || m.awayTeam?.name || m.teams?.away?.name || 'Away';
          const homeScore = m.home?.score ?? m.scores?.home ?? m.goals?.home ?? 0;
          const awayScore = m.away?.score ?? m.scores?.away ?? m.goals?.away ?? 0;
          const status = m.status?.reason?.short || m.status?.type || m.status?.short || 'Live';

          html += `
            <div class="match-card">
              <div>
                <div class="teams">${homeName} vs ${awayName}</div>
                <div class="status">${status}</div>
              </div>
              <div class="score">${homeScore} - ${awayScore}</div>
            </div>
          `;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error('Fetch error:', err);
        container.innerHTML = `<div class="error-msg">Updating live scores...</div>`;
      }
    }

    // Initial Fetch
    fetchScores();

    // Auto Refresh scores every 60 seconds (CDN Cached to protect API rate limits)
    setInterval(fetchScores, 60000);
  </script>

</body>
</html>
